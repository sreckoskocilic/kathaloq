version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # svelte-check and typescript-eslint still cap at typescript <6.1, so a TS 7
    # bump breaks `npm run check` and `npm run lint`.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
